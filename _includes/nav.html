<header class="site-head">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav -%}
        {%- assign target = item.url | relative_url -%}
        <a href="{{ target }}"{% if page.url contains item.url or (item.url == '/writing.html' and page.layout == 'post') %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
