---
layout: default
---
<div class="wrap">
  <div class="article-head">
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif -%}
    <div class="article-meta">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      {%- if page.reading_time %}<span>{{ page.reading_time }}</span>{% endif -%}
    </div>
  </div>

  <article class="article">
    {{ content }}
  </article>

  <p class="meta"><a href="{{ '/writing.html' | relative_url }}">&larr; All writing</a></p>
</div>
