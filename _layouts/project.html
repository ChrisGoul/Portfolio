---
layout: default
---
<div class="wrap">
  <div class="article-head">
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif -%}
    {%- if page.meta %}<div class="article-meta">{% for m in page.meta %}<span>{{ m }}</span>{% endfor %}</div>{% endif -%}
  </div>

  <article class="article">
    {{ content }}
  </article>

  <p class="meta" style="border-top:1px solid var(--rule); padding-top:18px;">
    <a href="{{ '/' | relative_url }}">&larr; All projects</a>
  </p>
</div>
