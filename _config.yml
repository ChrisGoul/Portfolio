title: Chris Goul
tagline: Mechanical design engineer
description: >-
  Staff mechanical design engineer at 1X Technologies, working on humanoid robot
  actuation. Hardware projects, and notes from training language models on a
  single consumer GPU.

# This site is served from https://chrisgoul.github.io/Portfolio/, which is a
# GitHub *project* page — so every internal link has to carry the /Portfolio
# prefix. Never hardcode a leading "/" in a URL; use the relative_url filter:
#   <a href="{{ '/writing/' | relative_url }}">
url: "https://chrisgoul.github.io"
baseurl: "/Portfolio"

author:
  name: Chris Goul
  github: ChrisGoul
  linkedin: christopher-goul
  email: chgoul3@gmail.com

nav:
  - { title: Projects, url: /projects.html }
  - { title: Writing, url: /writing.html }
  - { title: Resume,  url: /resume.html }
  - { title: Contact, url: /contact.html }

permalink: /writing/:title/


defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post

sass:
  style: compressed

exclude:
  - README.md
  - preview.py
  - _site_preview
  - .gitattributes

plugins:
  - jekyll-feed

feed:
  path: feed.xml
